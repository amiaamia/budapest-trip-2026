name: Complete Golan Shamir patch
on:
  push:
    paths:
      - '.github/workflows/patch-golan-shamir.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete Shamir definition in Golan site only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('golan-trip-2026/index.html')
          s=p.read_text()

          # Add a dedicated Shamir image if not present.
          if "KibbutzShamir_Park.jpg" not in s:
              needle="e:['https://images.globes.co.il/images/NewGlobes/big_image_800/2020/en-zivan_orly-genosar-800x392.2020611T145543.jpg','עין זיוון','https://www.ein-zivan.com/']};"
              repl="e:['https://images.globes.co.il/images/NewGlobes/big_image_800/2020/en-zivan_orly-genosar-800x392.2020611T145543.jpg','עין זיוון','https://www.ein-zivan.com/'],s:['https://upload.wikimedia.org/wikipedia/commons/3/3e/KibbutzShamir_Park.jpg','קיבוץ שמיר','https://commons.wikimedia.org/wiki/File:KibbutzShamir_Park.jpg']};"
              if needle not in s: raise SystemExit('IMG insertion point not found')
              s=s.replace(needle,repl,1)

          # Add P.s and correct Tirat Carmel center if not already done.
          if "s:{n:'קיבוץ שמיר'" not in s:
              needle="t:{n:'טירת הכרמל',c:'משפחה',m:'Tirat Carmel Israel',lat:32.76158,lon:34.97159,d:'צהריים עם המשפחה ביום שלישי.'},hod:{n:'הוד השרון'"
              repl="s:{n:'קיבוץ שמיר',c:'ביקור',m:'Kibbutz Shamir Israel',i:'s',lat:33.16528,lon:35.66083,d:'ביקור קצר ביום שלישי בדרך לטירת הכרמל.'},t:{n:'טירת הכרמל',c:'משפחה',m:'Tirat Carmel Israel',lat:32.76490,lon:34.96993,d:'צהריים עם המשפחה ביום שלישי.'},hod:{n:'הוד השרון'"
              if needle not in s: raise SystemExit('P.s insertion point not found')
              s=s.replace(needle,repl,1)
          else:
              s=s.replace("lat:32.76158,lon:34.97159","lat:32.76490,lon:34.96993")
              s=s.replace("lat:32.76667,lon:34.96667","lat:32.76490,lon:34.96993")

          required=["KibbutzShamir_Park.jpg","s:{n:'קיבוץ שמיר'","fitMapAspect","stops:[P.e,P.s,P.t,P.hod]","lat:32.76490,lon:34.96993"]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing after patch: '+repr(missing))
          p.write_text(s)
          PY
      - name: Commit Golan-only fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add golan-trip-2026/index.html
          git diff --cached --quiet || (git commit -m 'Complete Shamir point and Tirat Carmel map fix' && git push)
